name: Build Timesheet API

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Validate application Bicep
        run: az bicep build --file .infra/main.bicep --outfile /tmp/timesheet-main.json
      - name: Validate APIM Bicep
        run: az bicep build --file .infra/apim/main.bicep --outfile /tmp/timesheet-apim.json
      - name: Validate shell scripts
        run: bash -n .infra/scripts/*.sh
      - name: Restore
        run: dotnet restore Internal.Timesheet.Service.slnx
      - name: Build
        run: dotnet build Internal.Timesheet.Service.slnx --no-restore --configuration Release
      - name: Test
        run: dotnet test Internal.Timesheet.Service.slnx --no-build --no-restore --configuration Release
